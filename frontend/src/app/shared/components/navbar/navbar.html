<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="logo">
      <span class="logo-icon">+</span>
      <span class="logo-text">DocAppoint</span>
    </a>

    <div class="nav-links">
      <ng-container *ngIf="!auth.isLoggedIn()">
        <a routerLink="/login" routerLinkActive="active" class="nav-item">Login</a>
        <a routerLink="/register" routerLinkActive="active" class="nav-item btn-primary">Register</a>
      </ng-container>

      <ng-container *ngIf="auth.isLoggedIn()">
        <a routerLink="/doctors" routerLinkActive="active" class="nav-item">Doctors</a>
        <a routerLink="/my-bookings" routerLinkActive="active" class="nav-item">My Bookings</a>
        <div class="user-profile">
          <span class="user-name">{{ auth.getUser()?.name }}</span>
          <button (click)="logout()" class="nav-item btn-outline">Logout</button>
        </div>
      </ng-container>
    </div>
  </div>
</nav>
